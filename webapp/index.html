<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b0e14" />
<title>Friction Companion</title>
<style>
  :root {
    --bg: #0b0e14;
    --panel: #131826;
    --ink: #eef2ff;
    --muted: #8b95b0;
    --accent: #6ee7ff;
    --baseline: #34d3c4;
    --intention: #f5b73d;
    --encounter: #ff5d6c;
    --growth: #5ddc8a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex; align-items: center; justify-content: center;
    padding: max(20px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom));
    overflow: hidden;
  }
  .app {
    width: 100%; max-width: 440px;
    background: var(--panel);
    border-radius: 22px;
    padding: 26px 22px 30px;
    box-shadow: 0 18px 60px rgba(0,0,0,.5);
    position: relative;
  }
  h1 { font-size: 19px; margin: 0 0 2px; letter-spacing: .2px; }
  .tag { color: var(--muted); font-size: 13px; margin: 0 0 22px; }

  /* setup screen */
  .field { margin: 18px 0; }
  .field label { display:flex; justify-content:space-between; font-size:14px; color: var(--muted); margin-bottom:8px; }
  .field label b { color: var(--ink); font-variant-numeric: tabular-nums; }
  input[type=range] { width:100%; accent-color: var(--accent); }
  .quick { display:flex; gap:8px; margin: 6px 0 2px; }
  .quick button {
    flex:1; background:#1d2436; color:var(--ink); border:1px solid #2a3450;
    border-radius:12px; padding:10px 6px; font-size:13px; cursor:pointer;
  }
  .quick button:active { transform: scale(.98); }

  .start {
    width:100%; margin-top:24px; border:0; border-radius:16px;
    background: linear-gradient(135deg, #6ee7ff, #5ddc8a);
    color:#06121a; font-size:18px; font-weight:700; padding:18px; cursor:pointer;
  }
  .start:active { transform: scale(.99); }
  .note { color: var(--muted); font-size:12px; text-align:center; margin-top:14px; }
  .warn { color: #ffb4bd; font-size:13px; margin-top:14px; display:none; }

  /* running screen */
  .run { display:none; text-align:center; }
  .ring { position: relative; width: 230px; height: 230px; margin: 6px auto 10px; }
  .ring svg { transform: rotate(-90deg); }
  .ring .center {
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; padding: 0 24px;
  }
  .stage { font-size: 13px; letter-spacing: 3px; text-transform: uppercase; color: var(--muted); }
  .stagebig { font-size: 30px; font-weight: 800; margin: 2px 0 0; }
  .roundlbl { font-size:12px; color: var(--muted); margin-top:6px; }
  .cuebox {
    min-height: 96px; margin: 16px 6px 4px; padding: 16px 16px;
    background:#0e1320; border:1px solid #222b42; border-radius:14px;
    font-size: 18px; line-height:1.45;
  }
  .cuetone { color: var(--muted); font-size:12px; margin-top:8px; }
  .clock { color: var(--muted); font-size:13px; margin-top:14px; font-variant-numeric: tabular-nums; }
  .stop {
    margin-top:20px; width:100%; border:1px solid #3a2730; background:#1c1116;
    color:#ff9aa6; border-radius:14px; padding:14px; font-size:15px; cursor:pointer;
  }
  .muted-pulse { animation: pulse 2.2s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:.55} 50%{opacity:1} }
  .done .stagebig { color: var(--accent); }
</style>
</head>
<body>
<div class="app">

  <!-- ── SETUP ─────────────────────────────────────────── -->
  <div id="setup">
    <h1>Friction Companion</h1>
    <p class="tag">Press start. Train. It coaches you through the wall — out loud, live.</p>

    <div class="field">
      <label>Session length <b id="minVal">10 min</b></label>
      <input id="min" type="range" min="1" max="30" value="10" />
    </div>

    <div class="quick">
      <button data-min="1">1-min taste</button>
      <button data-min="10">10 min</button>
      <button data-min="20">20 min</button>
    </div>

    <button id="startBtn" class="start">▶  Start session</button>
    <p class="note">Use earbuds. Keep the screen on. Volume up.</p>
    <p id="warn" class="warn">This browser can’t speak out loud. Try Safari (iPhone) or Chrome.</p>
  </div>

  <!-- ── RUNNING ───────────────────────────────────────── -->
  <div id="run" class="run">
    <div class="ring">
      <svg width="230" height="230" viewBox="0 0 230 230">
        <circle cx="115" cy="115" r="104" fill="none" stroke="#1d2436" stroke-width="14"/>
        <circle id="prog" cx="115" cy="115" r="104" fill="none" stroke="var(--accent)"
                stroke-width="14" stroke-linecap="round"
                stroke-dasharray="653.45" stroke-dashoffset="653.45"/>
      </svg>
      <div class="center">
        <div class="stage" id="stage">getting ready</div>
        <div class="stagebig" id="stageBig">—</div>
        <div class="roundlbl" id="roundLbl"></div>
      </div>
    </div>
    <div class="cuebox">
      <div id="cueText" class="muted-pulse">Settle in. Listen.</div>
      <div id="cueTone" class="cuetone"></div>
    </div>
    <div class="clock" id="clock">0:00 / 0:00</div>
    <button id="stopBtn" class="stop">Stop session</button>
  </div>

</div>

<script>
/* ──────────────────────────────────────────────────────────────────────────
   Friction Companion — Stage-1 client.

   NO cues are baked into this page. On Start, each of the four stages
   (Baseline → Intention → Encounter → Growth) is fetched LIVE from the server
   (`POST /api/cue`), which runs the engine's real Anthropic generator. Each cue
   is spoken with the browser's built-in voice, and no cue begins before the
   previous one has finished speaking. Stages are spaced across the true session
   length, with the Encounter near the realistic break point.
   ────────────────────────────────────────────────────────────────────────── */

/* Fractions of the session at which each stage's cue is spoken. Baseline and
   Intention set you up early; the long stretch between Intention and Encounter
   is the silent "work" phase; the Encounter lands in the last ~14% (the wall);
   Growth consolidates just before the end. */
const PLAN = [
  { key: 'BASELINE',  frac: 0.00 },
  { key: 'INTENTION', frac: 0.25 },
  { key: 'ENCOUNTER', frac: 0.86 },
  { key: 'GROWTH',    frac: 0.94 },
];

const STAGE_SUB = {
  BASELINE:  "you are capable — settle",
  INTENTION: "aim your focus",
  TRACK:     "holding… stay with it",
  ENCOUNTER: "the wall — push through",
  GROWTH:    "bank it · take more"
};
const STAGE_COLOR = {
  BASELINE: "var(--baseline)", INTENTION: "var(--intention)",
  TRACK: "var(--intention)", ENCOUNTER: "var(--encounter)", GROWTH: "var(--growth)"
};

const $ = (id) => document.getElementById(id);
const RING = 2 * Math.PI * 104;

function mmss(ms) {
  const s = Math.max(0, Math.round(ms / 1000));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}

/** Pure: the spoken time (ms from start) for each stage, given a duration. */
function computeSchedule(durationMs) {
  return PLAN.map((p) => ({ key: p.key, frac: p.frac, atMs: Math.round(p.frac * durationMs) }));
}

/* ── speech (browser built-in voice, unchanged) ─────────────────────────── */
let voice = null;
function loadVoice() {
  const vs = window.speechSynthesis ? speechSynthesis.getVoices() : [];
  voice = vs.find(v => /en[-_]US/i.test(v.lang) && /google|samantha|aria|natural/i.test(v.name))
       || vs.find(v => /^en/i.test(v.lang)) || vs[0] || null;
}
if (window.speechSynthesis) {
  loadVoice();
  speechSynthesis.onvoiceschanged = loadVoice;
}

/* ── live cue fetch (no baked cues; the server is the only source) ───────── */
async function fetchCue(stage, round) {
  try {
    const res = await fetch('/api/cue', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ stage, round })
    });
    if (!res.ok) throw new Error('server ' + res.status);
    return await res.json(); // { cue: {AudioTranscript, DeliveryTone, ...}, origin, ... }
  } catch (e) {
    // No fabricated cue text here — keep the "no baked cues" contract. Surface
    // the failure; the stage shows a note and speaks nothing.
    return { cue: { AudioTranscript: '', DeliveryTone: '' }, origin: 'unreachable', error: String(e) };
  }
}

/* ── run state ──────────────────────────────────────────────────────────── */
let running = false;
let session = null;      // { startedAt, durationMs }
let timers = [];         // clearable timeouts
let onStop = [];         // resolvers to release awaits on stop()
let rafId = null;
let wakeLock = null;

function cancelableSleep(ms) {
  return new Promise((resolve) => {
    const id = setTimeout(resolve, ms);
    timers.push(id);
    onStop.push(() => { clearTimeout(id); resolve(); });
  });
}
function waitUntil(atMs) {
  const elapsed = performance.now() - session.startedAt;
  return cancelableSleep(Math.max(0, atMs - elapsed));
}

/** Speak `text`; resolves when speech ends (or on stop / safety timeout). Never
    lets the next cue overlap this one. Records timing for verification. */
function speak(text, stage, origin) {
  const rec = { stage, text, origin, startedAt: performance.now(), endedAt: null };
  window.__spoken.push(rec);
  return new Promise((resolve) => {
    const done = () => { if (rec.endedAt == null) { rec.endedAt = performance.now(); resolve(); } };
    onStop.push(done);
    if (!window.speechSynthesis || !text) { done(); return; }
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    if (voice) u.voice = voice;
    u.rate = 0.98; u.pitch = 1.0; u.volume = 1.0;
    u.onend = done; u.onerror = done;
    speechSynthesis.speak(u);
    // Safety net if onend never fires (some mobile browsers): estimate duration.
    const id = setTimeout(done, Math.max(3500, text.length * 90));
    timers.push(id);
  });
}

/* ── UI ─────────────────────────────────────────────────────────────────── */
function setStageUI(state) {
  $("stage").textContent = STAGE_SUB[state] || state.toLowerCase();
  $("stageBig").textContent = state === "TRACK" ? "INTENTION" : state;
  $("stageBig").style.color = STAGE_COLOR[state] || "var(--ink)";
  $("prog").style.stroke = STAGE_COLOR[state] || "var(--accent)";
  if (state === "TRACK") {
    $("cueText").classList.add("muted-pulse");
    $("cueText").textContent = "Holding the line… stay with it.";
    $("cueTone").textContent = "";
  }
}
function setCueText(text, tone, origin) {
  const el = $("cueText");
  el.classList.remove("muted-pulse");
  el.textContent = text || "(server unreachable — no cue)";
  $("cueTone").textContent = origin === 'unreachable' ? "connection lost" : (tone || "");
}
function tickClock() {
  if (!session) return;
  const elapsed = performance.now() - session.startedAt;
  const frac = Math.min(1, elapsed / session.durationMs);
  $("prog").style.strokeDashoffset = String(RING * (1 - frac));
  $("clock").textContent = mmss(elapsed) + " / " + mmss(session.durationMs);
  rafId = requestAnimationFrame(tickClock);
}

/* ── the session flow (faithful to the engine's lifecycle) ──────────────── */
async function runSession(durationMs) {
  window.__spoken = [];
  window.__sessionDone = false;
  window.__schedule = computeSchedule(durationMs);
  running = true;
  onStop = []; timers = [];
  session = { startedAt: performance.now(), durationMs };

  $("setup").style.display = "none";
  $("run").style.display = "block";
  $("run").classList.remove("done");
  setStageUI("BASELINE");
  $("cueText").classList.add("muted-pulse");
  $("cueText").textContent = "Settle in. Listen.";
  tickClock();

  try { wakeLock = await navigator.wakeLock.request("screen"); } catch (e) {}

  const schedule = window.__schedule;
  let speechDone = Promise.resolve();

  for (let i = 0; i < schedule.length; i++) {
    const s = schedule[i];
    if (!running) return;

    // Prefetch this stage's cue now; it resolves while we wait for its moment.
    const cuePromise = fetchCue(s.key, 1);

    // Never start a cue before the previous one has finished speaking.
    await speechDone;
    if (!running) return;

    // Between cues, show the silent "holding/tracking" state (engine goes quiet).
    if (i > 0) setStageUI("TRACK");

    // Wait until this stage's scheduled moment in the real timeline.
    await waitUntil(s.atMs);
    if (!running) return;

    const resp = await cuePromise;
    if (!running) return;

    setStageUI(s.key);
    setCueText(resp.cue.AudioTranscript, resp.cue.DeliveryTone, resp.origin);
    speechDone = speak(resp.cue.AudioTranscript, s.key, resp.origin);
  }

  await speechDone;
  if (!running) return;
  finish();
}

function finish() {
  running = false;
  clearTimers();
  $("run").classList.add("done");
  $("stage").textContent = "complete";
  $("stageBig").textContent = "DONE";
  $("stageBig").style.color = "var(--accent)";
  $("prog").style.strokeDashoffset = "0";
  $("cueText").classList.remove("muted-pulse");
  $("cueText").textContent = "That's the set. You met the wall and moved it. Breathe.";
  $("cueTone").textContent = "";
  if (window.speechSynthesis) {
    const u = new SpeechSynthesisUtterance("That's the set. You met the wall, and you moved it. Breathe.");
    if (voice) u.voice = voice; u.rate = 0.98;
    speechSynthesis.speak(u);
  }
  releaseWake();
  window.__sessionDone = true;
}

function clearTimers() { timers.forEach(clearTimeout); timers = []; if (rafId) cancelAnimationFrame(rafId); rafId = null; }
function releaseWake() { if (wakeLock) { try { wakeLock.release(); } catch (e) {} wakeLock = null; } }

function stop() {
  running = false;
  clearTimers();
  onStop.forEach((fn) => { try { fn(); } catch (e) {} });
  onStop = [];
  if (window.speechSynthesis) speechSynthesis.cancel();
  releaseWake();
  session = null;
  $("run").style.display = "none";
  $("setup").style.display = "block";
}

/* ── wiring ─────────────────────────────────────────────────────────────── */
$("min").addEventListener("input", e => $("minVal").textContent = e.target.value + " min");
document.querySelectorAll(".quick button").forEach(b => b.addEventListener("click", () => {
  $("min").value = b.dataset.min; $("minVal").textContent = b.dataset.min + " min";
}));
$("startBtn").addEventListener("click", () => {
  if (!window.speechSynthesis) { $("warn").style.display = "block"; return; }
  // First speak inside the tap gesture → unlocks audio on iOS.
  speechSynthesis.cancel();
  speechSynthesis.speak(new SpeechSynthesisUtterance(" "));
  runSession(parseInt($("min").value, 10) * 60000);
});
$("stopBtn").addEventListener("click", stop);
if (!window.speechSynthesis) $("warn").style.display = "block";

// Test hooks (used by webapp/verify.mjs).
window.runSession = runSession;
window.computeSchedule = computeSchedule;
window.__spoken = [];
window.__sessionDone = false;
</script>
</body>
</html>
