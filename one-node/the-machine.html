<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The machine</title>
<style>
:root{
  --paper:#efe9dd; --ink:#221d17; --soft:#6d6152; --faint:#b4a68f;
  --metal:#9a6b14; --hot:#8c3a24;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
}
*{box-sizing:border-box} html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--serif);overflow:hidden}
.frame{height:100%;display:grid;grid-template-rows:auto 1fr auto}
header{padding:16px 24px 2px}
h1{font-size:21px;font-weight:500;margin:0}
.sub{color:var(--soft);font-size:14px;margin-top:2px}
main{position:relative;min-height:0}
canvas{position:absolute;inset:0;width:100%;height:100%}
.gauge{position:absolute;left:24px;top:6px;width:186px;font-size:13.5px;color:var(--soft)}
.gauge .lab{display:flex;justify-content:space-between;margin-bottom:5px}
.gauge .lab b{font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums}
.bar{height:6px;background:#e0d6c2;position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 100% 0 0;background:var(--ink);transition:right .3s linear,background .5s}
.bar.hot i{background:var(--hot)}
.read{margin-top:9px;line-height:1.4;min-height:3.6em}
.read b{font-weight:500;color:var(--ink)}
.ledger{position:absolute;right:24px;top:6px;width:196px;font-size:13.5px;color:var(--soft);text-align:right}
.ledger .n{font-size:26px;color:var(--ink);line-height:1.1}
.ledger .list{margin-top:8px;line-height:1.45;font-size:12.5px;max-height:190px;overflow:hidden}
.ledger .list div{opacity:.85}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--paper);font-size:13px;
  padding:6px 9px;max-width:260px;line-height:1.35;opacity:0;transition:opacity .12s}
.tip.on{opacity:1}
footer{padding:6px 24px 18px;text-align:center}
.controls{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
button{font:15px var(--serif);padding:9px 16px;cursor:pointer;border:1px solid var(--ink);
  background:var(--ink);color:var(--paper)}
button.q{background:none;color:var(--ink)}
button:disabled{opacity:.35;cursor:default}
button:focus-visible{outline:2px solid var(--metal);outline-offset:2px}
.cap{color:var(--soft);font-size:14px;margin-top:9px;min-height:1.4em}
.cap em{font-style:normal;color:var(--ink)}
@media (max-width:820px){
  header{padding:12px 14px 0} h1{font-size:18px}
  .gauge{left:12px;width:150px;font-size:12.5px}
  .ledger{right:12px;width:120px}.ledger .list{display:none}
  footer{padding:4px 12px 12px}
}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style></head><body>
<div class="frame">
 <header>
  <h1>The machine</h1>
  <div class="sub">Generation is constant. It doesn't wait for an exit.</div>
 </header>
 <main id="main">
  <canvas id="c"></canvas>
  <div class="gauge">
   <div class="lab"><span>Pressure</span><b id="pv">0%</b></div>
   <div class="bar" id="bar"><i id="fill"></i></div>
   <div class="read" id="read"></div>
  </div>
  <div class="ledger">
   <div>Deposited</div><div class="n" id="dn">0</div>
   <div class="list" id="dl"></div>
  </div>
  <div class="tip" id="tip"></div>
 </main>
 <footer>
  <div class="controls">
   <button id="dep">Make a deposit</button>
   <button class="q" id="pause">Pause</button>
   <button class="q" id="rst">Reset</button>
  </div>
  <div class="cap" id="cap">Watch it for a minute before touching anything.</div>
 </footer>
</div>
<script>
const cv=document.getElementById('c'),cx=cv.getContext('2d');
let W=0,H=0,S=1,OX=0,OY=0;
const VW=1080,VH=620;
function fit(){const r=cv.parentElement.getBoundingClientRect(),d=devicePixelRatio||1;
  W=r.width;H=r.height;cv.width=W*d;cv.height=H*d;cx.setTransform(d,0,0,d,0,0);
  S=Math.min(W/VW,H/VH)*0.96;OX=(W-VW*S)/2;OY=(H-VH*S)/2;}
addEventListener('resize',fit);
const X=x=>OX+x*S, Y=y=>OY+y*S, U=v=>v*S;

// ---- structure ----
const R={
 head:    {n:'Mental pressure',x:540,y:78, fix:1,gen:1.5,cap:26,isle:'A'},
 mind:    {n:'Processing',     x:540,y:150,fix:1,gen:0.9,cap:26,isle:'A'},
 throat:  {n:'The outlet',     x:540,y:212,fix:0,gen:0,   cap:0, isle:null},
 identity:{n:'Identity',       x:540,y:300,fix:1,gen:0.5,cap:22,isle:'B'},
 will:    {n:'Will',           x:640,y:270,fix:1,gen:1.1,cap:22,isle:'B'},
 instinct:{n:'Instinct',       x:412,y:352,fix:1,gen:0.9,cap:22,isle:'B'},
 engine:  {n:'The work engine',x:540,y:376,fix:1,gen:2.4,cap:34,isle:'B'},
 emotion: {n:'Emotion',        x:672,y:376,fix:0,gen:0,   cap:0, isle:null},
 pressure:{n:'Pressure',       x:540,y:462,fix:1,gen:1.7,cap:26,isle:'B'},
};
const WI=[['head','mind'],['identity','will'],['identity','engine'],['identity','instinct'],
          ['engine','instinct'],['instinct','pressure']];
const NB={};for(const k in R)NB[k]=[];
WI.forEach(([a,b])=>{NB[a].push(b);NB[b].push(a)});
const SEAL=[
 {n:'Begin new experience',r:'pressure',dx:-58,dy:34},
 {n:'Mutate within a limit',r:'pressure',dx:58,dy:34},
 {n:'Direct resources',r:'engine',dx:-74,dy:26},
 {n:'Completion',r:'engine',dx:74,dy:26},
 {n:'Precise naming',r:'throat',dx:-62,dy:-6},
 {n:'Demonstrated craft',r:'throat',dx:62,dy:-6},
 {n:'Material control',r:'will',dx:52,dy:-24},
 {n:'Melancholy',r:'emotion',dx:54,dy:-22},
 {n:'Principles',r:'emotion',dx:62,dy:10},
 {n:'Social openness',r:'emotion',dx:54,dy:42},
];
const FIG=['M540 24 c16 0 29 15 29 35 0 22-13 40-29 40 s-29-18-29-40 c0-20 13-35 29-35 Z',
 'M526 96 h28 v18 h-28 Z',
 'M540 108 c28 0 51 6 60 17 10 12 13 36 12 66 -1 28-5 58-9 84 -3 21-5 43-6 62 l-114 0 c-1-19-3-41-6-62 -4-26-8-56-9-84 -1-30 2-54 12-66 9-11 32-17 60-17 Z',
 'M486 118 c-14 9-21 32-26 71 -3 32-6 66-8 96 -1 15-2 28-3 38 l17 2 c1-11 3-24 4-38 3-30 6-64 10-94 4-28 9-51 17-64 Z',
 'M594 118 c14 9 21 32 26 71 3 32 6 66 8 96 1 15 2 28 3 38 l-17 2 c-1-11-3-24-4-38 -3-30-6-64-10-94 -4-28-9-51-17-64 Z',
 'M485 340 c2 70 5 148 6 218 l0 42 h43 l1-42 c1-70 3-148 4-218 Z',
 'M595 340 c-2 70-5 148-6 218 l0 42 h-43 l-1-42 c-1-70-3-148-4-218 Z'].map(d=>new Path2D(d));

// ---- state ----
let P=[],load={},t0=performance.now(),run=true,drain=0,deposits=[],peak=0,elapsed=0,touched=false;
function reset(){P=[];for(const k in R)load[k]=0;drain=0;deposits=[];peak=0;elapsed=0;touched=false;
  document.getElementById('dn').textContent='0';document.getElementById('dl').innerHTML='';
  document.getElementById('cap').innerHTML='Watch it for a minute before touching anything.';}
reset();

function spawn(k){const r=R[k];const a=Math.random()*6.28;
  P.push({k,x:r.x,y:r.y,to:null,p:0,sp:0,age:0,a,rr:16+Math.random()*10,dw:.5+Math.random()*1.6});}
function retarget(pt){
  const n=NB[pt.k];
  if(drain>0 && (R[pt.k].isle==='B'||pt.k==='throat')){
    // an open route: head for the outlet
    if(pt.k!=='throat'){
      // step toward throat via identity
      const path={engine:'identity',instinct:'identity',pressure:'instinct',will:'identity',identity:'throat'};
      pt.to=path[pt.k]||'identity';pt.p=0;pt.sp=.030+Math.random()*.016;return;
    } else {pt.to='OUT';pt.p=0;pt.sp=.03;return;}
  }
  if(!n.length){pt.to=null;return;}
  pt.to=n[(Math.random()*n.length)|0];pt.p=0;pt.sp=.006+Math.random()*.006;
}

function step(dt){
  elapsed+=dt;
  for(const k in R){const r=R[k];if(!r.gen)continue;
    r.acc=(r.acc||0)+r.gen*dt*0.42;
    while(r.acc>=1){r.acc-=1;spawn(k);}}
  const load2=Object.assign({},load);
  for(const k in R)load[k]=0;
  for(let i=P.length-1;i>=0;i--){const pt=P[i];pt.age+=dt;
    if(!pt.to){ if(pt.dw>0){pt.dw-=dt;
        const r=R[pt.k],n=load2[pt.k]||0;
        pt.a+=dt*0.5; const rad=pt.rr+Math.min(26,n*0.55);
        pt.x=r.x+Math.cos(pt.a)*rad; pt.y=r.y+Math.sin(pt.a)*rad*0.8;
        load[pt.k]=(load[pt.k]||0)+1; continue;}
      retarget(pt);}
    if(pt.to==='OUT'){pt.p+=pt.sp*dt*60;
      if(pt.p>=1){P.splice(i,1);continue;}
      const a=R.throat;pt.x=a.x;pt.y=a.y-pt.p*150;continue;}
    if(pt.to){const a=R[pt.k],b=R[pt.to];pt.p+=pt.sp*dt*60;
      const e=pt.p<1?pt.p:1;
      pt.x=a.x+(b.x-a.x)*e;pt.y=a.y+(b.y-a.y)*e;
      if(pt.p>=1){pt.k=pt.to;pt.to=null;pt.p=0;pt.dw=drain>0?0:(.5+Math.random()*1.8);pt.a=Math.random()*6.28;}}
    load[pt.k]=(load[pt.k]||0)+1;}
  if(drain>0)drain=Math.max(0,drain-dt);
  const tot=P.length,capT=Object.values(R).reduce((s,r)=>s+r.cap,0);
  const pr=Math.min(1,tot/capT);peak=Math.max(peak,pr);
  const pv=Math.round(pr*100);
  document.getElementById('pv').textContent=pv+'%';
  document.getElementById('fill').style.right=(100-pv)+'%';
  document.getElementById('bar').classList.toggle('hot',pr>.66);
  const rd=document.getElementById('read');
  const mindLoad=(load.head||0)+(load.mind||0);
  rd.innerHTML = pr<.25 ? 'Running clear.'
    : pr<.5 ? 'Filling. Nothing has left yet.'
    : pr<.72 ? 'Building. The parts with no route are holding the most.'
    : '<b>Frustration.</b> Not tiredness. Pressure with nowhere to go.';
  if(deposits.length && mindLoad>34 && pr<.6)
    rd.innerHTML='The body drained. <b>The mind did not.</b> Nothing connects them.';
  if(!touched && pr>.8){touched=true;
    document.getElementById('cap').innerHTML='<em>Nothing is broken. There is just no exit.</em>';}
  return pr;
}

function draw(pr){
  cx.clearRect(0,0,W,H);
  cx.save();cx.translate(OX,OY);cx.scale(S,S);
  // figure
  cx.fillStyle='#ded3bd';FIG.forEach((p,i)=>{cx.fillStyle=(i===3||i===4)?'#d5c8ae':'#ded3bd';cx.fill(p)});
  // wires
  cx.strokeStyle='#221d17';cx.lineWidth=2.6;cx.lineCap='round';
  WI.forEach(([a,b])=>{cx.beginPath();cx.moveTo(R[a].x,R[a].y);cx.lineTo(R[b].x,R[b].y);cx.stroke()});
  // open route
  if(drain>0){cx.save();cx.globalAlpha=Math.min(1,drain*2);
    cx.strokeStyle='#9a6b14';cx.lineWidth=2.4;cx.setLineDash([7,6]);
    cx.beginPath();cx.moveTo(R.identity.x,R.identity.y);cx.lineTo(R.throat.x,R.throat.y);
    cx.lineTo(R.throat.x,R.throat.y-150);cx.stroke();cx.restore();}
  // sealed
  SEAL.forEach(s=>{const r=R[s.r],x=r.x+s.dx,y=r.y+s.dy;
    cx.beginPath();cx.arc(x,y,4.6,0,7);cx.fillStyle='#9a6b14';cx.fill();
    cx.beginPath();cx.arc(x,y,10,0,7);cx.strokeStyle='#9a6b14';cx.lineWidth=1;
    cx.setLineDash([2.6,3]);cx.stroke();cx.setLineDash([]);});
  // regions
  for(const k in R){const r=R[k];
    const swell=r.cap?Math.min(1,(load[k]||0)/r.cap):0;
    const rad=(r.fix?15:16)+swell*7;
    cx.beginPath();cx.arc(r.x,r.y,rad,0,7);
    if(r.fix){cx.fillStyle=swell>.85?'#8c3a24':'#221d17';cx.fill();}
    else{cx.fillStyle='#efe9dd';cx.fill();cx.setLineDash([4,4]);}
    cx.strokeStyle='#221d17';cx.lineWidth=2.2;cx.stroke();cx.setLineDash([]);
    cx.fillStyle='#221d17';cx.font='13px "Iowan Old Style",Georgia,serif';cx.textAlign='center';
    cx.strokeStyle='#efe9dd';cx.lineWidth=4.5;cx.lineJoin='round';
    cx.strokeText(r.n,r.x,r.y+rad+16);cx.fillText(r.n,r.x,r.y+rad+16);}
  // particles on top
  for(const pt of P){cx.beginPath();cx.arc(pt.x,pt.y,3,0,7);
    cx.fillStyle=pr>.66?'rgba(150,60,36,.92)':'rgba(154,107,20,.9)';cx.fill();}
  cx.restore();
}

let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;
  const pr=run?step(dt):(P.length/Object.values(R).reduce((s,r)=>s+r.cap,0));
  draw(Math.min(1,pr));requestAnimationFrame(loop);}
fit();requestAnimationFrame(loop);

document.getElementById('dep').addEventListener('click',()=>{
  const before=P.length;drain=4.2;
  for(const pt of P){if(R[pt.k].isle==='B'||pt.k==='throat'){pt.dw=0;pt.to=null;}}
  const d=new Date();
  setTimeout(()=>{const out=Math.max(0,before-P.length);
    deposits.unshift({n:deposits.length+1,out});
    document.getElementById('dn').textContent=deposits.length;
    document.getElementById('dl').innerHTML=deposits.slice(0,8).map(x=>
      `<div>Deposit ${String(x.n).padStart(3,'0')} · ${x.out} out</div>`).join('');
    document.getElementById('cap').innerHTML=deposits.length===1
      ? 'One route, open briefly. It closes again on its own.'
      : (deposits.length>=3?'<em>The exit never widens. The rhythm is what keeps it low.</em>':'Again. Watch how fast it refills.');
  },4400);
});
document.getElementById('pause').addEventListener('click',e=>{run=!run;e.target.textContent=run?'Pause':'Resume';});
document.getElementById('rst').addEventListener('click',()=>{reset();document.getElementById('cap').innerHTML='Watch it for a minute before touching anything.';});

// hover
const tip=document.getElementById('tip');
cv.addEventListener('mousemove',ev=>{const b=cv.getBoundingClientRect();
  const mx=(ev.clientX-b.left-OX)/S,my=(ev.clientY-b.top-OY)/S;let hit=null;
  for(const k in R){const r=R[k];if(Math.hypot(mx-r.x,my-r.y)<24){hit=
    r.fix?`${r.n} — always on. Generating whether or not anything can leave.`
         :(k==='throat'?'The outlet — the only way anything reaches the world. Nothing connects to it.'
                       :'Emotion — takes in whatever is around it. Pressure here reads as mood, not as pressure.');}}
  if(!hit)for(const s of SEAL){const r=R[s.r];
    if(Math.hypot(mx-(r.x+s.dx),my-(r.y+s.dy))<14)hit=`${s.n} — real, and attached to nothing.`;}
  if(hit){tip.textContent=hit;tip.classList.add('on');
    tip.style.left=Math.min(ev.clientX-b.left+12,W-280)+'px';tip.style.top=(ev.clientY-b.top+14)+'px';}
  else tip.classList.remove('on');});
cv.addEventListener('mouseleave',()=>tip.classList.remove('on'));
</script></body></html>
